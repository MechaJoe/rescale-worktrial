services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
      POSTGRES_DB: jobs
    ports:
      # 5433 on the host so this never collides with a local PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # `backend` waits on this, so it never races the database during startup.
      test: ["CMD-SHELL", "pg_isready -U jobs -d jobs"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://jobs:jobs@db:5432/jobs
      DJANGO_SECRET_KEY: dev-only-insecure-key-change-me
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,backend
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Migrations run here rather than in the image's CMD so that `docker compose
    # run backend <cmd>` (used by `make test`) skips them. A single instance
    # makes this safe; production would run migrations as a separate step.
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    healthcheck:
      # 127.0.0.1, not `localhost`: the container resolves localhost to ::1
      # first and gunicorn binds IPv4 only, so a localhost probe depends on the
      # client retrying the next address. Being explicit keeps the check from
      # relying on that, and saves a refused connection on every interval.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
