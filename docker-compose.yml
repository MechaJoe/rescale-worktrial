services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
      POSTGRES_DB: jobs
    ports:
      # 5433 on the host so this never collides with a local PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # `backend` waits on this, so it never races the database during startup.
      test: ["CMD-SHELL", "pg_isready -U jobs -d jobs"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://jobs:jobs@db:5432/jobs
      DJANGO_SECRET_KEY: dev-only-insecure-key-change-me
      DJANGO_DEBUG: "false"
      # nginx forwards the Host the browser used, so every name the app is
      # reached by must be listed — including `frontend`, which is how a client
      # inside the compose network (the E2E test runner) addresses it.
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0,backend,frontend
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Migrations run here rather than in the image's CMD so that `docker compose
    # run backend <cmd>` (used by `make test`) skips them. A single instance
    # makes this safe; production would run migrations as a separate step.
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    healthcheck:
      # 127.0.0.1, not `localhost`: the container resolves localhost to ::1
      # first and gunicorn binds IPv4 only, so a localhost probe depends on the
      # client retrying the next address. Being explicit keeps the check from
      # relying on that, and saves a refused connection on every interval.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/')
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    ports:
      # The app and the API share this origin: nginx proxies /api to `backend`,
      # so the browser makes no cross-origin request and needs no backend port.
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 rather than `localhost`: the container resolves localhost to
      # ::1 first, and nginx listens only on IPv4, so the probe would be refused.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # The Playwright suite. Behind a profile so `docker compose up` and `make up`
  # never start it; `make test` opts in with --profile test.
  e2e:
    build:
      context: ./e2e
    profiles: ["test"]
    environment:
      BASE_URL: http://frontend
    depends_on:
      frontend:
        condition: service_healthy
    # Chromium uses shared memory heavily, and Docker's default 64 MB /dev/shm
    # can crash it mid-run; Playwright's documentation recommends host IPC.
    # `init` reaps the browser's child processes when the run ends.
    ipc: host
    init: true

volumes:
  postgres_data:
