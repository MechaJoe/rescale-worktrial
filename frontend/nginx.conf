server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API is proxied under the same origin the app is served from, so the
    # browser never makes a cross-origin request and CORS never applies. It also
    # means no backend URL has to be baked into the JavaScript bundle at build
    # time — the hostname below is resolved by Docker's DNS at request time.
    location /api/ {
        proxy_pass http://backend:8000;
        # $http_host, not $host: $host drops the port, so Django would build
        # absolute URLs — the pagination cursors among them — pointing at port
        # 80 instead of the port the app is actually served on.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed assets are immutable, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths are client-side routes, not 404s, so they
    # fall back to index.html for the router to resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
